name: CI

# NOTE ON BRANCHES: this repo's default branch is `feat/oauth-http`, not `main` or `master`.
# These triggers must name a branch that actually exists or the workflow never fires.
on:
  push:
    branches: [feat/oauth-http]
  pull_request:
    branches: [feat/oauth-http]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
