name: CI

# NOTE ON BRANCHES: this repo's default branch is `feat/oauth-http`, not `main` or `master`.
# These triggers must name a branch that actually exists or the workflow never fires.
on:
  push:
    branches: [feat/oauth-http]
  pull_request:
    branches: [feat/oauth-http]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # MUST stay in sync with `engines.node` in package.json (>=20). Testing a version we do not
      # claim is noise; claiming a version we do not test is a lie.
      #
      # Node 18 was dropped deliberately, and NOT merely because a test helper broke on it. The
      # SHIPPED code fails there: `jose` verifies our ES256 access tokens via WebCrypto, which it
      # reaches through `globalThis.crypto` — a global that only exists from Node 19 (Node 18 has
      # it only as `require("node:crypto").webcrypto`). Verified against a valid, correctly signed
      # token on v18.20.8: jose throws `ReferenceError: crypto is not defined`, and because
      # TokenVerifier.verify() catches broadly to avoid leaking why a token failed, that surfaces
      # as `UnauthorizedError: invalid or expired token`. The server therefore does not crash on
      # Node 18 — it starts, then silently rejects EVERY valid token. Same token verifies fine on
      # 20, 22 and 24.
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
